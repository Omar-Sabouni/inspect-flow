[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspect-flow"
version = "0.3.0"
description = "Conveyor defect inspection with OpenCV rules and a small CNN, checked against ground truth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.9",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.52",
]

[project.optional-dependencies]
test = ["httpx2>=2.12", "pytest>=9", "pytest-cov>=6"]
dev = ["build>=1.2", "mypy>=1.15", "pillow>=13; python_version >= \"3.11\"", "pip-audit>=2.8", "ruff>=0.11"]
train = ["onnx>=1.17", "torch>=2.4"]

[project.scripts]
inspect-flow = "inspectflow.cli:main"

[tool.setuptools.packages.find]
include = ["inspectflow*"]

[tool.setuptools.package-data]
inspectflow = ["models/*", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inspectflow"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120

[tool.mypy]
files = ["inspectflow"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
