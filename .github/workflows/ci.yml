name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            pylock.toml
      - run: python -m pip install --upgrade pip
      - name: Install portable dependency ranges (minimum Python)
        if: matrix.python-version == '3.10'
        run: python -m pip install -r requirements-dev.txt
      - name: Install hashed dependency lock (reference Python)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r pylock.toml
          python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: mypy
      - name: Test with coverage
        run: >-
          pytest
          --cov=inspectflow
          --cov-branch
          --cov-report=term-missing
          --cov-report=json
      - name: Enforce coverage floors
        run: >-
          python scripts/check_coverage.py coverage.json
          --min-lines 90
          --min-branches 85

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pylock.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r pylock.toml
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - run: python scripts/smoke_wheel.py dist/*.whl

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pylock.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r pylock.toml
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: pip-audit --local

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pylock.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r pylock.toml
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag inspect-flow:ci .
      - name: Start container
        run: >-
          docker run --detach --name inspect-flow
          --publish 127.0.0.1:8000:8000 inspect-flow:ci
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/ready; then exit 0; fi
            sleep 1
          done
          docker logs inspect-flow
          exit 1
      - name: Run a CNN inspection in the container
        run: |
          curl --silent --show-error --fail -X POST http://127.0.0.1:8000/api/runs \
            -H 'content-type: application/json' \
            -d '{"scenario":"poor_lighting","detector":"cnn","frame_count":24}' \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['evaluation']['gate'])"
      - name: Show container logs
        if: failure()
        run: docker logs inspect-flow
