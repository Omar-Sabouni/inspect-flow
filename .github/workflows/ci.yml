name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[test,dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest --cov
      - run: pip-audit --local --skip-editable

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inspect-flow .
      - run: docker run -d -p 127.0.0.1:8000:8000 inspect-flow
      - name: Run the CNN inside the container
        run: |
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8000/api/health; do sleep 1; done'
          curl -sf -X POST http://127.0.0.1:8000/api/runs -H 'content-type: application/json' \
            -d '{"scenario": "poor_lighting", "detector": "cnn", "frame_count": 24}' \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['evaluation']['gate']['verdict_accuracy'] == 1.0"
